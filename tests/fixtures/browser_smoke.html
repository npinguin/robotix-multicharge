<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MultiCharge source-backed Chromium UX check</title>
<style>
:root { --card-background-color: #fff; --secondary-background-color: #f6f8fa; --divider-color: #d7dde3; --primary-text-color: #20252b; --secondary-text-color: #536171; --primary-color: #2779bb; color-scheme: light; }
@media(prefers-color-scheme: dark) {
 :root { --card-background-color: #20242b; --secondary-background-color: #292f38; --divider-color: #48505c; --primary-text-color: #f2f5f8; --secondary-text-color: #c0c7d0; --primary-color: #89baff; color-scheme: dark; }
}
html,body { margin:0; padding:0; width:100%; background:var(--secondary-background-color); color:var(--primary-text-color); font:14px/1.5 system-ui,sans-serif; }
main { padding:8px; max-width:1400px; margin:auto; box-sizing:border-box; }
</style>
<script src="../../custom_components/robotix_multicharge/frontend/vendor/apexcharts.min.js"></script>
<script src="../../custom_components/robotix_multicharge/frontend/robotix-multicharge.js"></script>
</head>
<body>
<main><robotix-multicharge-card></robotix-multicharge-card></main>
<pre id="smoke-result"></pre>
<script>
(async function(){
  const args=new URLSearchParams(location.search);
  const count=Math.max(0,Math.min(10,Number(args.get("count")||0)));
  const role=args.get("role")==="resident"?"resident":"admin";
  const view=args.get("view")||"overview";
  const devices=Array.from({length:count},(_,i)=>({
    id:"charger_"+i,name:"Charger "+(i+1),kind:"on_off",control_owner:"external",
    physical_commissioned:false,rated_power_kw:3.6,asset:"vehicle_"+i
  }));
  const assets=Array.from({length:count},(_,i)=>({
    id:"vehicle_"+i,name:"Vehicle "+(i+1),kind:"car",
    target_soc:80,requested_kwh:8,ready_by:"2026-11-23T21:00:00+01:00"
  }));
  const observations={assets:{},chargers:{},sources:{tariff_quality:"SOURCE_NOT_SELECTED"}};
  devices.forEach((c,i)=>{
    observations.chargers[c.id]={
      connected:{quality:"ok",value:i%2===0,reason:"OK"},
      power_kw:{quality:"ok",value:0,reason:"OK"}
    };
    observations.assets[assets[i].id]={soc:{quality:"ok",value:45,reason:"OK"}};
  });
  const data={
    controller_id:"home",timezone:"Europe/Brussels",status:"proposed",
    start:"2026-11-23T00:00:00+01:00",end:"2026-11-24T00:00:00+01:00",
    configuration_revision:"browser-smoke-1",
    configuration:{
      controller:{id:"home",name:"Home charging",mode:"Off",
        max_parallel:Math.max(1,count),max_power_kw:3.6,plan_color_by:"vehicle"},
      assets,chargers:devices
    },
    observations,slots:[],actual_slots:[],forecast_slots:[],price_slots:[],
    charger_states:Object.fromEntries(devices.map((c,i)=>[c.id,{
      activation:"inactive",connection_state:i%2===0?"asset_connected":"no_asset_connected",
      charging_session:"stopped",charging_state:"waiting",reason:"CHARGER_INACTIVE",
      operational_status:{status:"idle",reason:null},asset_operational_status:{status:"idle",reason:null},
    }])),
    asset_policy_defaults:{priority:0,continuous_charging:false,opportunistic_kind:"off",maintain_soc_until_ready_by:true},
    reasons:{},shortfall_kwh:{},completed_sessions:[],active_sessions:{},
    command_capabilities:{},command_outcomes:{},connection_identity:{},
    preference_entities:{
      controller:{mode:"select.site_mode",max_parallel:"number.site_parallel",
        max_power_kw:"number.site_power"},
      assets:Object.fromEntries(assets.map(a=>[a.id,{
        target_soc:"number."+a.id+"_soc",ready_by:"datetime."+a.id+"_ready"
      }])),
      chargers:Object.fromEntries(devices.map(c=>[c.id,{
        asset:"select."+c.id+"_selected_vehicle"
      }]))
    },
    plan_palette:{blue:"#3779B9",orange:"#D98B39"}
  };
  // Nonfabricated source-backed plan test observations: missing intervals
  // remain empty, and price may only appear with one explicit EUR/spot basis.
  if(count>0&&view==="plan"){
    assets[0].plan_color="blue";
    if(count>1)assets[1].plan_color="orange";
    data.actual_slots=[{charger_id:"charger_0",asset_id:null,
      start:"2026-11-23T10:00:00+01:00",
      end:"2026-11-23T10:15:00+01:00",actual_power_kw:1.43}];
    data.slots=[{charger_id:"charger_0",asset_id:"vehicle_0",
      start:"2026-11-23T11:00:00+01:00",
      end:"2026-11-23T11:15:00+01:00",proposed_power_kw:2.3,
      accepted_power_kw:0,proposed_energy_kwh:0.575}];
    data.forecast_slots=[{charger_id:"charger_0",asset_id:"vehicle_0",start:"2026-11-23T12:00:00+01:00",end:"2026-11-23T12:15:00+01:00",indicative_power_kw:3.6}];
    if(count>1)data.forecast_slots.push({charger_id:"charger_1",asset_id:"vehicle_1",
      start:"2026-11-23T23:45:00+01:00",end:"2026-11-24T00:00:00+01:00",
      indicative_power_kw:2.0});
    data.goal_assessments=Object.fromEntries(data.forecast_slots.map(row=>[row.charger_id,{
      asset_id:row.asset_id,status:"achievable",conditional:true,reason:"PROPOSED",
      required_grid_kwh:row.indicative_power_kw/4,planned_grid_kwh:row.indicative_power_kw/4,
      shortfall_grid_kwh:0,timeline_start:data.start,timeline_end:data.end,
      timeline_windows:[{start:row.start,end:row.end}],deadline:row.end
    }]));
    data.price_slots=[{start:"2026-11-23T10:00:00+01:00",
      end:"2026-11-23T10:15:00+01:00",price_per_kwh:0.23,
      currency:"EUR",basis:"spot"}];
  }
  const card=document.querySelector("robotix-multicharge-card");
  card.setConfig({});
  const requests=[];
  if(view==="overview"&&count){
    const period={cost:2.4,currency:"EUR",basis:"spot",average_price_per_kwh:0.24,covered_energy_kwh:10,days_available:1,days_expected:1};
    const periods={today:period,month:{...period,cost:12},year:{...period,cost:null,covered_cost:80,days_available:10,days_expected:300}};
    data.period_costs={controller:{site:periods},asset:Object.fromEntries(assets.map(a=>[a.id,periods]))};
  }
  card.hass={user:{is_admin:role==="admin"},language:"en",states:{},
    callWS:async request=>{requests.push(request);return data;},callService:async()=>{}};
  await new Promise(resolve=>setTimeout(resolve,400));
  if(!card._data)throw Error("real browser failed to receive backend sample");
  card._tab=view==="asset"?"Chargeable Assets":
            view==="charger"?"Chargers":
            view==="plan"?"Charging Plan":"Overview";
  const renderStarted=performance.now();
  card.render();
  const renderMs=performance.now()-renderStarted;
  if(args.get("metrics")==="1"){
    await new Promise(resolve=>setTimeout(resolve,1400));
    const root=card.shadowRoot,hosts=[...root.querySelectorAll(".mc-apex")];
    document.getElementById("smoke-result").textContent=JSON.stringify({
      render:!!root.querySelector(".root"),viewport:innerWidth,documentWidth:document.documentElement.scrollWidth,
      tabs:[...root.querySelectorAll(".tabs button")].map(b=>b.textContent),
      apexHosts:hosts.length,apexLive:hosts.filter(h=>h.querySelector(".apexcharts-svg")).length,
      domElements:root.querySelectorAll("*").length,renderMs,
      planRequests:requests.filter(r=>r.type==="robotix_multicharge/get_plan").length,
      historyRequests:requests.filter(r=>r.type==="robotix_multicharge/get_plan"&&r.include_history).length
    });return;
  }
  let navigationReset=true,financeCompact=true,visibleSafety=true;
  if(view==="overview"&&count){
    const root=card.shadowRoot;
    const finance=[...root.querySelectorAll('details[data-disclosure$=":finance"]')];
    financeCompact=finance.length===count+1&&finance.every(el=>!el.open&&
      el.querySelector("summary")?.textContent.includes("Cost details")&&
      el.parentElement.querySelector(".financial-headline")?.textContent.includes("Charging cost today")&&
      [...el.parentElement.querySelectorAll(".financial-headline .metric")].every(m=>m.getBoundingClientRect().height>0)&&
      el.parentElement.querySelector(".financial-headline")?.textContent.includes("Energy today")&&
      el.querySelector(".financial-details")?.getBoundingClientRect().height===0);
    const first=finance[0];
    first.querySelector("summary").click();
    financeCompact=financeCompact&&first.open&&
      first.querySelector(".financial-details").textContent.includes("Charging cost this year")&&
      first.querySelector(".financial-details").getBoundingClientRect().height>0;
    first.querySelector("summary").click();
    const action=[...root.querySelectorAll(".object-grid button")].find(b=>b.textContent==="Charging plan");
    action.click();
    await new Promise(resolve=>setTimeout(resolve,80));
    const filtered=card._filter==="asset:vehicle_0"&&requests.at(-1).asset_id==="vehicle_0"&&
      !![...root.querySelectorAll("button")].find(b=>b.textContent==="All chargers");
    const tab=label=>[...root.querySelectorAll(".tabs button")].find(b=>b.textContent===label);
    tab("Charging Plan").click();
    await new Promise(resolve=>setTimeout(resolve,80));
    navigationReset=filtered&&card._filter===""&&!requests.at(-1).asset_id&&
      !requests.at(-1).charger_id&&root.querySelectorAll(".plan-lane").length===count;
    tab("Overview").click();
    await new Promise(resolve=>setTimeout(resolve,80));
    const target=devices[count-1],originalPower=observations.chargers[target.id].power_kw;
    observations.chargers[target.id].power_kw={quality:"unavailable",value:null};
    data.command_capabilities[target.id]={stop_allowed:true};
    card.render();
    const stop=[...root.querySelectorAll(`[data-mc-object="asset:${target.asset}"] button`)].find(b=>b.textContent==="Stop charging");
    visibleSafety=role==="admin"?!!stop&&!stop.disabled&&stop.getBoundingClientRect().height>0:!stop;
    delete data.command_capabilities[target.id];observations.chargers[target.id].power_kw=originalPower;card.render();
  }
  if(view==="setup"){
    const c=devices[0];c.kind="variable_current";c.control_entity="switch.native_evse";
    c.max_current_a=16;
    data.charger_setup={[c.id]:{device_matched:true,
      proposed_missing:{power_entity:"sensor.native_power",current_control_entity:"number.native_current",
        min_current_a:6,current_step_a:1},
      native_current:{min_current_a:6,max_current_a:32,current_step_a:1},
      configured_current:{max_current_a:16},effective_current:{max_current_a:16}}};
    data.observed_sessions=[{charger_id:c.id,asset_id:null,
      started_at:"2026-11-23T10:00:00+01:00",ended_at:"2026-11-23T10:30:00+01:00",
      start_known:true,end_known:true,complete_observed_window:true,ongoing:false,
      observed_energy_kwh:1.5,observed_duration_minutes:30,average_power_kw:3,peak_power_kw:4,
      estimated_cost:0.42,estimated_cost_currency:"EUR",estimated_cost_basis:"spot"}];
    data.charger_states={[c.id]:{activation:"inactive",switch_state:"on"}};
    observations.chargers[c.id].power_kw.value=2;
    let writes=0,busy=true;
    card.hass={user:{is_admin:true},language:"en",states:{},
      callWS:async msg=>{
        if(msg.type==="robotix_multicharge/update_settings"){
          writes++;
          if(msg.changes.control_owner&&busy)throw Error("CHARGER_BUSY_STOP_FIRST");
          Object.assign(c,msg.changes);
          if(msg.changes.control_owner){
            c.physical_commissioned=true;
            data.charger_states[c.id].activation="active";
          }
          data.configuration_revision="setup-"+writes;
          return {status:"accepted_unconfirmed",expected_revision:data.configuration_revision};
        }
        return data;
      }};
    card._tab="Chargers";card.render();
    const root=card.shadowRoot;
    const btn=(prefix,scope=root)=>[...scope.querySelectorAll("button")].find(x=>x.textContent.startsWith(prefix));
    const observed=root.textContent.includes("1.50 kWh")&&root.textContent.includes("0.42 EUR")&&
      root.textContent.includes("Vehicle unknown")&&root.textContent.includes("not a bill");
    const review=btn("Review charger setup");
    const visibleSetup=!!review&&review.getBoundingClientRect().height>0;
    review.click();
    const editor=root.querySelector(".dashboard-field-edit");
    const prefilled=editor.getBoundingClientRect().height>0&&[...editor.querySelectorAll("input")].some(x=>x.value==="sensor.native_power");
    const progressive=editor.querySelector("details")?.open===false;
    const noWrite=writes===0;
    btn("Save charger setup",editor).click();
    await new Promise(resolve=>setTimeout(resolve,150));
    const reviewed=writes===1&&c.power_entity==="sensor.native_power"&&c.max_current_a===16&&
      !root.querySelector(".dashboard-field-edit");
    btn("Change activation").click();
    const activation=root.querySelector(".dashboard-field-edit");
    activation.querySelector("select").value="multicharge";
    btn("Save",activation).click();
    await new Promise(resolve=>setTimeout(resolve,150));
    const denied=writes===2&&root.querySelector(".dashboard-field-edit")===activation&&
      activation.querySelector("select").value==="multicharge"&&
      root.textContent.includes("Stop charging with the current owner")&&c.control_owner==="external";
    busy=false;data.charger_states[c.id].switch_state="off";
    observations.chargers[c.id].power_kw.value=0;
    btn("Save",activation).click();
    await new Promise(resolve=>setTimeout(resolve,150));
    const active=writes===3&&c.control_owner==="multicharge"&&
      !root.querySelector(".dashboard-field-edit")&&root.textContent.includes("Active");
    document.getElementById("smoke-result").textContent=JSON.stringify({
      view,count,role,viewport:innerWidth,render:!!root.querySelector(".root"),
      documentWidth:document.documentElement.scrollWidth,
      tabs:[...root.querySelectorAll(".tabs button")].map(b=>b.textContent),
      observed,visibleSetup,prefilled,progressive,noWrite,reviewed,denied,active
    });
    return;
  }
  if(view==="goal"){
    // Real browser interaction on a representative planner-shaped payload.
    // Source tests separately prove the actual planner's 192-quarter result.
    const a=assets[0],c=devices[0],start="2026-11-24T20:45:00+01:00";
    data.start="2026-11-24T00:00:00+01:00";data.end="2026-11-26T00:00:00+01:00";
    Object.assign(a,{name:"Audi Q8",target_soc:95,capacity_kwh:20,charge_efficiency:0.9,
      ready_by:"2026-11-25T06:00:00+01:00",ready_by_repeat:"daily",plan_color:"blue"});
    delete a.requested_kwh;
    observations.assets[a.id].soc.value=88;
    observations.assets[a.id].next_ready_by=a.ready_by;
    c.name="Garage Black";
    data.configuration.controller.mode="Automatic";
    data.goal_assessments={[c.id]:{asset_id:a.id,status:"achievable",conditional:true,
      assumption:"IF_ACTIVATED",reason:"PROPOSED",deadline:a.ready_by,
      required_grid_kwh:1.56,planned_grid_kwh:1.8,shortfall_grid_kwh:0,
      timeline_start:start,timeline_end:"2026-11-26T20:45:00+01:00",
      timeline_windows:[{start:"2026-11-25T02:00:00+01:00",end:"2026-11-25T02:30:00+01:00"}],
      next_charge_at:"2026-11-25T02:00:00+01:00",planned_finish_at:"2026-11-25T02:30:00+01:00"}};
    let writes=0;
    card.hass={user:{id:"goal-browser",is_admin:true},states:{},language:"en",
      callWS:async msg=>{
        if(msg.type==="robotix_multicharge/update_settings"){
          writes++;Object.assign(a,msg.changes);
          data.configuration_revision="goal-saved-"+writes;
          return {status:"accepted_unconfirmed",expected_revision:data.configuration_revision};
        }
        return data;
      }};
    card._tab="Chargeable Assets";card.render();
    const root=card.shadowRoot;
    const btn=name=>[...root.querySelectorAll("button")].find(x=>x.textContent===name);
    const outcome=()=>root.querySelector('[data-goal-status]');
    const summary=()=>root.querySelector(".vehicle-summary");
    const initial=outcome()?.getAttribute("data-goal-status")==="achievable"&&
      summary()?.textContent.includes("88%")&&summary()?.textContent.includes("95%")&&
      summary()?.textContent.includes("Inactive")&&
      !!outcome().querySelector(".goal-window")&&!!outcome().querySelector(".goal-deadline-marker")&&
      outcome().textContent.includes("1.56 kWh")&&outcome().textContent.includes("Not reserved");
    const compact=!!btn("Set charging goal")&&!btn("Save charging goal")&&
      summary().getBoundingClientRect().height<135;
    const variants={};
    for(const status of ["target_met","shortfall","cannot_assess"]){
      data.goal_assessments[c.id].status=status;
      if(status==="cannot_assess"){
        data.goal_assessments[c.id].reason="BATTERY_CAPACITY_NOT_CONFIGURED";
        delete a.capacity_kwh;
      }
      card.render();
      variants[status]=outcome()?.getAttribute("data-goal-status")===status;
    }
    const actionable=!!btn("Complete battery data");
    a.capacity_kwh=20;data.goal_assessments[c.id].status="achievable";
    data.goal_assessments[c.id].reason="PROPOSED";card.render();
    btn("Schedule charging").click();btn("Specific days").click();
    const day=name=>root.querySelector('button[aria-label="'+name+'"]');
    const allDays=day("Saturday")?.getAttribute("aria-pressed")==="true";
    day("Saturday").click();day("Sunday").click();btn("Different times per day").click();
    const friday=[...root.querySelectorAll(".field")].find(n=>n.querySelector("label")?.textContent==="Friday")?.querySelector("input");
    friday.value="08:00";friday.dispatchEvent(new Event("change",{bubbles:true}));
    const noImplicitWrite=writes===0;
    btn("Save schedule").click();
    await new Promise(resolve=>setTimeout(resolve,150));
    const saved=writes===1&&a.ready_by_weekdays?.fri==="08:00"&&a.ready_by_weekdays?.mon==="06:00"&&!a.ready_by_weekdays?.sat;
    btn("Schedule charging").click();
    const reopened=[...root.querySelectorAll(".field")].some(n=>n.querySelector("label")?.textContent==="Friday"&&n.querySelector("input")?.value==="08:00");
    btn("Cancel").click();
    card._tab="Overview";card.render();
    const shared=!!outcome()?.querySelector(".goal-window")&&!!summary();
    document.getElementById("smoke-result").textContent=JSON.stringify({
      view,count,role,viewport:innerWidth,render:!!root.querySelector(".root"),
      documentWidth:document.documentElement.scrollWidth,
      tabs:[...root.querySelectorAll(".tabs button")].map(b=>b.textContent),
      initial,compact,actionable,allDays,noImplicitWrite,saved,reopened,shared,
      variants:Object.values(variants).every(Boolean)
    });
    return;
  }
  if(view==="edit"){
    // REAL Chromium/iPad-class regression: while a user types, HA sensor
    // updates and a late get_plan result must not unmount inputs, blur the
    // keyboard or silently discard unsaved values.
    data.configuration.controller.solar_power_entity="sensor.energy_solar_power";
    card._tab="Settings";
    card._settingsOpen="Sources & bindings";
    card._editingField="controller:home:solar_power_entity";
    card.render();
    const root=card.shadowRoot;
    const field=root.querySelector(".dashboard-field-edit input");
    if(!field)throw Error("Typed Controller source field absent");
    if(root.querySelectorAll(".dashboard-field-edit").length!==1)
      throw Error("Duplicate source editor rendered");
    field.focus();
    field.value="sensor.user_is_still_typing";
    field.dispatchEvent(new Event("input",{bubbles:true,composed:true}));
    const originalRoot=root.querySelector(".root");
    let backendResponses=0;
    const updated={...data,observations:{
      ...data.observations,sources:{tariff_quality:"SOURCE_CHANGED_DURING_TYPING"}
    }};
    let releaseLate;
    const late=new Promise(resolve=>{releaseLate=resolve;});
    card.hass={user:{is_admin:true},language:"en",
      states:{"sensor.energy_solar_power":{state:"2",last_changed:new Date().toISOString()}},
      callWS:async request=>{
        if(request.type==="robotix_multicharge/update_settings")
          throw Error("SETTINGS_REJECTED");
        backendResponses++;
        if(backendResponses===1)return late;
        return updated;
      },
      callService:async()=>{}
    };
    // Both HA updates and in-flight async response occur after edit starts.
    const pending=card.load();
    releaseLate(updated);
    await pending;
    await new Promise(resolve=>setTimeout(resolve,480));
    const focused=root.activeElement===field;
    const backgroundSaved=card._data?.observations?.sources?.tariff_quality===
      "SOURCE_CHANGED_DURING_TYPING";
    const inputRetained=field.isConnected&&field.value==="sensor.user_is_still_typing"&&
      root.querySelector(".root")===originalRoot;
    field.blur();
    await card.load();
    const dirtyRetained=field.isConnected&&field.value==="sensor.user_is_still_typing";
    const save=root.querySelector(".dashboard-field-edit button");
    if(!save)throw Error("Typed source Save missing");
    save.click();
    await new Promise(resolve=>setTimeout(resolve,90));
    const rejectedRetained=field.isConnected&&field.value==="sensor.user_is_still_typing"&&
      !!root.querySelector("[data-mc-edit-error]");
    // Explicit Cancel/view navigation may repaint; no hidden timeout may.
    card._editingField="";
    card.render();
    const explicitRepaint=!field.isConnected&&root.querySelector(".root")!==originalRoot;
    const report={view,count,role,viewport:innerWidth,
      render:!!root.querySelector(".root"),
      documentWidth:document.documentElement.scrollWidth,
      tabs:[...root.querySelectorAll(".tabs button")].map(b=>b.textContent),
      focused,inputRetained,backgroundSaved,dirtyRetained,rejectedRetained,
      explicitRepaint,backendResponses};
    document.getElementById("smoke-result").textContent=JSON.stringify(report);
    return;
  }
  if(view==="yaml"){
    // Real Chromium: the same production editor with no frontend role
    // visibility gate and one authoritative Save, while HA states change.
    card._tab="Settings";card.render();
    const root=card.shadowRoot;
    const expert=root.querySelector('details[data-disclosure="controller:expert"]');
    if(!expert)throw Error("Expert settings disclosure missing");
    if(!expert.open)expert.querySelector("summary").click();
    const edit=[...root.querySelectorAll("button")].find(b=>b.textContent==="Edit YAML");
    if(!edit||edit.getBoundingClientRect().height<=0)throw Error("Visible Edit YAML button missing");
    edit.click();
    const textarea=root.querySelector(".yaml-editor textarea");
    if(!textarea)throw Error("YAML textarea missing");
    const textareaOpen=textarea.rows>=20&&textarea.value.includes('"controller"');
    textarea.focus();
    const draft=JSON.parse(textarea.value);
    draft.controller.name="Browser-saved complete configuration";
    textarea.value=JSON.stringify(draft,null,2);
    textarea.dispatchEvent(new Event("input",{bubbles:true,composed:true}));
    const save=[...root.querySelectorAll("button")].find(b=>b.textContent==="Save");
    const saveAvailable=!!save&&!save.disabled&&
      ![...root.querySelectorAll("button")].some(b=>b.textContent==="Review changes");
    const originalRoot=root.querySelector(".root");
    let backendResponses=0;
    card.hass={user:{is_admin:true},language:"en",states:{
      "sensor.any_live_source":{state:"3"}
    },callWS:async request=>{
      if(request.type==="robotix_multicharge/yaml_configuration"){
        if(Object.hasOwn(request,"operation")||Object.hasOwn(request,"reviewed_revision"))
          throw Error("OLD_REVIEW_FLOW");
        data.configuration=JSON.parse(request.yaml_text);
        data.configuration_revision="browser-save-2";
        return {status:"accepted_unconfirmed",expected_revision:"browser-save-2"};
      }
      backendResponses++;
      return data;
    },callService:async()=>{}};
    await card.load();
    await new Promise(resolve=>setTimeout(resolve,480));
    const draftRetained=textarea.isConnected&&root.activeElement===textarea&&
      textarea.value===JSON.stringify(draft,null,2)&&
      originalRoot===root.querySelector(".root");
    save.click();
    await new Promise(resolve=>setTimeout(resolve,160));
    const savedConfirmed=data.configuration.controller.name===
      "Browser-saved complete configuration"&&
      !textarea.isConnected&&root.textContent.includes("Saved");
    const reopen=[...root.querySelectorAll("button")].find(b=>b.textContent==="Edit YAML");
    if(!reopen)throw Error("Editor did not close after readback");
    reopen.click();
    const second=root.querySelector(".yaml-editor textarea");
    second.value="draft not to be saved";
    second.dispatchEvent(new Event("input",{bubbles:true,composed:true}));
    const cancel=[...root.querySelectorAll("button")].find(b=>b.textContent==="Cancel");
    cancel.click();
    const cancelled=!second.isConnected&&data.configuration.controller.name===
      "Browser-saved complete configuration";
    const report={
      count,role,view,viewport:innerWidth,render:!!root.querySelector(".root"),
      documentWidth:document.documentElement.scrollWidth,
      tabs:[...root.querySelectorAll(".tabs button")].map(b=>b.textContent),
      textareaOpen,saveAvailable,draftRetained,
      savedConfirmed,cancelled,backendResponses
    };
    document.getElementById("smoke-result").textContent=JSON.stringify(report);
    return;
  }
  if(view==="asset"||view==="charger"){
    const details=[...card.shadowRoot.querySelectorAll("button")].find(
      b=>b.textContent==="Details");
    if(details)details.click();
  }
  let defaultChartHosts=0,foldedChartHosts=0,chartLifecycle=true;
  if(view==="plan"){
    const compact=[...card.shadowRoot.querySelectorAll('details[data-disclosure^="plan:compact:"]')];
    if(compact.some(f=>f.open||f.querySelector(".mc-apex")))throw Error("Compact lanes eagerly render charts");
    defaultChartHosts=card.shadowRoot.querySelectorAll(".mc-apex").length;
    for(const f of compact)f.querySelector("summary").click();
    await new Promise(resolve=>setTimeout(resolve,120));
    foldedChartHosts=card.shadowRoot.querySelectorAll(".mc-apex").length;
    for(const f of compact)f.querySelector("summary").click();
    await new Promise(resolve=>setTimeout(resolve,80));
    chartLifecycle=compact.every(f=>!f.open&&!f.querySelector(".mc-apex"))&&card.shadowRoot.querySelectorAll(".mc-apex").length===defaultChartHosts;
    for(const f of compact)f.querySelector("summary").click();
  }
  // The chart must be real Apex-generated SVG, not our previous static SVG
  // or a lightweight Apex-looking replacement.
  await new Promise(resolve=>setTimeout(resolve,1250));
  const root=card.shadowRoot,frame=root.querySelector(".root");
  const folds=[...root.querySelectorAll("details.owner-group")];
  const cards=[...root.querySelectorAll(".object-card")];
  const buttons=[...root.querySelectorAll("button")].map(b=>b.textContent);
  const rect=frame?.getBoundingClientRect();
  const apexHosts=[...root.querySelectorAll('[data-chart-engine="apexcharts-3.49.1"]')];
  const apexLive=apexHosts.filter(x=>x.querySelector(".apexcharts-svg")).length;
  const quick=[...root.querySelectorAll('select[data-quick-assignment]')];
  const chartLegend=root.querySelector(".combined-plan .legend");
  const chartHost=root.querySelector(".combined-plan .mc-apex");
  const rangeStart=String(Date.parse(data.start)),rangeEnd=String(Date.parse(data.end));
  const timelines=[...root.querySelectorAll(".goal-timeline")];
  const sameRange=[...apexHosts,...timelines].every(el=>
    el.getAttribute("data-range-start")===rangeStart&&el.getAttribute("data-range-end")===rangeEnd);
  const colorAndQuarter=view!=="plan"||count<2||(()=>{
    const opts=JSON.parse(chartHost?._mcSignature||"{}");
    const one=opts.series?.findIndex(s=>s.name.includes("Indicative")&&s.name.includes("Vehicle 1"));
    const two=opts.series?.findIndex(s=>s.name.includes("Indicative")&&s.name.includes("Vehicle 2"));
    if(!(one>=0&&two>=0))return false;
    const interval=opts.series[one].data.filter(p=>p.y===3.6);
    const windows=[...root.querySelectorAll(".goal-window")];
    const laneOpts=apexHosts.slice(1).map(el=>JSON.parse(el._mcSignature));
    const visiblePath=chartHost.querySelectorAll(".apexcharts-series path").length>0;
    return visiblePath&&opts.colors[one]==="#3779B9"&&opts.colors[two]==="#D98B39"&&
      interval.length===2&&interval[1].x-interval[0].x===899999&&
      windows.length===2&&windows[0].style.background==="rgb(55, 121, 185)"&&
      windows[1].style.background==="rgb(217, 139, 57)"&&
      laneOpts.every(o=>o.series.some((s,i)=>s.name.includes("Indicative")&&
        ["#3779B9","#D98B39"].includes(o.colors[i])));
  })();
  // Measure actual rendered horizontal SVG grid lines and goal bars, not
  // matching metadata alone. All quarter positions must share one pixel axis.
  const gridBounds=host=>[...host.querySelectorAll(".apexcharts-gridline")]
    .map(el=>el.getBoundingClientRect()).filter(r=>r.width>20&&r.height<3)
    .sort((a,b)=>b.width-a.width)[0];
  const geometry=[...apexHosts.map(gridBounds),
    ...timelines.map(el=>el.querySelector(".goal-track").getBoundingClientRect())];
  const pixelAligned=view!=="plan"||geometry.length>1&&geometry.every(Boolean)&&
    Math.max(...geometry.map(r=>r.left))-Math.min(...geometry.map(r=>r.left))<=3&&
    Math.max(...geometry.map(r=>r.right))-Math.min(...geometry.map(r=>r.right))<=3;
  const toggle=chartLegend?.querySelector("button");
  if(toggle)toggle.click();
  const report={
    count,role,view,viewport:innerWidth,navigationReset,financeCompact,visibleSafety,
    render:!!frame,frameWidth:Math.round(rect?.width||0),
    documentWidth:document.documentElement.scrollWidth,
    tabs:[...root.querySelectorAll(".tabs button")].map(b=>b.textContent),
    cards:cards.length,folds:folds.length,
    apexHosts:apexHosts.length,apexLive,defaultChartHosts,foldedChartHosts,chartLifecycle,sameRange,colorAndQuarter,pixelAligned,geometry:geometry.map(r=>r?[r.left,r.right]:null),
    legendContained:!!chartLegend&&chartLegend.getBoundingClientRect().top>=chartHost.getBoundingClientRect().bottom-1,
    legendToggle:toggle?.getAttribute("aria-pressed")==="false",
    priceAndForecast:!!chartLegend&&chartLegend.textContent.includes("Reference price")&&chartLegend.textContent.includes("Indicative"),
    apexErrors:apexHosts.filter(x=>!x.querySelector(".apexcharts-svg")).map(x=>x.textContent.slice(0,220)),
    quickSelectors:quick.filter(x=>x.getBoundingClientRect().height>0).length,
    overviewGrid:view!=="overview"||count<2||innerWidth<900||(()=>{
      const cards=[...root.querySelectorAll(".object-grid > .card")];
      const a=cards[0]?.getBoundingClientRect(),b=cards[1]?.getBoundingClientRect();
      return !!a&&!!b&&Math.abs(a.top-b.top)<2&&b.left>a.left;
    })(),
    siteDetailsLocal:view!=="overview"||!!root.querySelector('.charging-site-overview > details[data-disclosure="site:energy"]'),
    siteFirst:view!=="overview"||!!root.querySelector(".charging-site-overview")&&
      (!count||root.querySelector(".charging-site-overview").getBoundingClientRect().top<
        root.querySelector(".vehicle-summary").getBoundingClientRect().top),
    assetAssignmentActions:[...root.querySelectorAll("button")].filter(x=>["Change charger","Assign charger"].includes(x.textContent)&&x.getBoundingClientRect().height>0).length,
    quickEditable:quick.filter(x=>!x.disabled).length,
    firstFoldClosed:folds.length?folds[0].open===false:null,
    keyboardSummary:folds.every(x=>x.firstElementChild?.tagName==="SUMMARY"),
    goalEditable:[...root.querySelectorAll("button")].some(x=>x.textContent==="Set charging goal"&&x.getBoundingClientRect().height>0),
    technicalReadable:root.textContent.includes("Complete object settings & sources"),
    commandButtons:buttons.filter(x=>x==="Start charging"||x==="Stop charging").length,
    errors:root.querySelectorAll("[role=alert]").length
  };
  document.getElementById("smoke-result").textContent=JSON.stringify(report);
})().catch(error=>{
  document.getElementById("smoke-result").textContent=JSON.stringify({fatal:String(error)});
});
</script>
</body>
</html>
