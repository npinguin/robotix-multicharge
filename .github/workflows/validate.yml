name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Syntax
        run: python -m compileall -q custom_components tests
      - name: Contracts and package
        run: python -m unittest discover -s tests -v
