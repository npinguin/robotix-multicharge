name: Validate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install pinned source linter
        run: python -m pip install ruff==0.14.7
      - name: Canonical developer checks
        run: python scripts/dev.py check
      - name: Deterministic source package
        run: python scripts/dev.py package
      - name: Home Assistant metadata validation
        uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb
      - name: Native Home Assistant 2026.11.2 API import (developer smoke)
        run: |
          python -m pip install --index-url https://pypi.org/simple homeassistant==2026.11.2
          # Native backup requirements come from the pinned installed HA package.
          python -m pip install --index-url https://pypi.org/simple $(python -c 'import homeassistant,json,pathlib; print(" ".join(json.loads((pathlib.Path(homeassistant.__file__).parent/"components/backup/manifest.json").read_text())["requirements"]))')
          python -c "from custom_components.robotix_multicharge import config_flow, plan_query, command_query, sensor, frontend, button, select, number, datetime, text, binary_sensor; assert hasattr(command_query.websocket_charge_command, '_ws_command'); assert hasattr(command_query.websocket_update_settings, '_ws_command'); assert hasattr(plan_query.websocket_get_plan, '_ws_command'); assert hasattr(button, '_SafeStopButton'); assert hasattr(sensor, '_ControllerLiveSensor'); assert hasattr(sensor, '_ChargerCurrentSensor'); assert hasattr(select, '_OwnedSelect'); assert hasattr(number, '_AssetNumber'); assert hasattr(number, '_SiteNumber'); assert hasattr(datetime, '_AssetDateTime'); assert hasattr(text, '_OwnerName'); assert hasattr(binary_sensor, '_ChargerBinary'); print('Native Home Assistant integration imports PASS')"
      - name: Verify actually packaged community HACS source and diagnostics on HA
        run: python scripts/qa_hacs_artifact.py
      - name: Installed Home Assistant config entry and logical-device smoke
        run: |
          python -m pip install --index-url https://pypi.org/simple pytest-homeassistant==2026.11.2
          # Initialize HA's httpx alias before third-party pytest plugin discovery.
          python -c 'import homeassistant; import pytest; raise SystemExit(pytest.main(["-q", "-rP", "-o", "asyncio_mode=auto", "tests/ha_runtime/test_native_integration.py"]))'
      - name: Real Chromium responsive user-journey proof
        run: python scripts/qa_browser.py
      - name: Save visual TEST evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multicharge-ux-browser
          path: dist/ux-browser-proof/*.png
          if-no-files-found: ignore
          retention-days: 7
