name: Validate

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned source linter
        run: python -m pip install ruff==0.14.7
      - name: Canonical developer checks
        run: python scripts/dev.py check
      - name: Deterministic source package
        run: python scripts/dev.py package
      - name: Home Assistant metadata validation
        uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb
      - name: Native Home Assistant 2026.11.2 API import (developer smoke)
        run: |
          python -m pip install homeassistant==2026.11.2
          python -c "from custom_components.robotix_multicharge import config_flow, plan_query, command_query, sensor, frontend; assert hasattr(command_query.websocket_charge_command, '_ws_command'); assert hasattr(plan_query.websocket_get_plan, '_ws_command'); print('Native Home Assistant integration imports PASS')"
