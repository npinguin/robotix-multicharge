name: Publish HACS TEST

# Community source distribution; this is not a protected Premium build.
# Trigger only after exact main source validation, never on dev or PR checks.
on:
  workflow_run:
    workflows: [Validate]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: read

concurrency:
  group: ${{ github.repository }}-hacs-test-publication
  cancel-in-progress: false

jobs:
  community-test:
    name: Exact-main, authorized immutable community TEST
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
      - name: Match exact validated main and one-time TEST authorization
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse origin/main)" = "$SOURCE_SHA"
          VERSION="$(python -c 'import json;print(json.load(open("custom_components/robotix_multicharge/manifest.json"))["version"])')"
          TAG="v$VERSION"
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('custom_components/robotix_multicharge/manifest.json').read_text())
          request = json.loads(Path('release/TEST_REQUEST.json').read_text())
          assert manifest['domain'] == 'robotix_multicharge'
          assert manifest['dependencies'] == []
          assert request['status'] == 'AUTHORIZED_FOR_TEST'
          assert request['distribution'] == 'open_source_community'
          assert request['expected_tag'] == 'v' + manifest['version']
          assert request['precompile'] is False
          assert Path('LICENSE').exists() and Path('hacs.json').exists()
          PY
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Already published $TAG — do not rebuild or move immutable release" >> "$GITHUB_STEP_SUMMARY"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git show-ref --tags --verify --quiet "refs/tags/$TAG"; then
            echo "Tag $TAG exists without release; no reuse or overwrite permitted" >&2
            exit 1
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "Validated exact main: $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.publish == 'true'
        with:
          python-version: '3.14'
      - name: Assemble deterministic full community source (no compilation)
        if: steps.gate.outputs.publish == 'true'
        run: python scripts/dev.py package
      - name: Verify actual shipped archive under pinned Home Assistant
        if: steps.gate.outputs.publish == 'true'
        run: |
          python -m pip install --index-url https://pypi.org/simple homeassistant==2026.11.2
          # Native backup requirements come from the pinned installed HA package.
          python -m pip install --index-url https://pypi.org/simple $(python -c 'import homeassistant,json,pathlib; print(" ".join(json.loads((pathlib.Path(homeassistant.__file__).parent/"components/backup/manifest.json").read_text())["requirements"]))')
          python scripts/qa_hacs_artifact.py
      - name: Installed Home Assistant smoke of exact source-equivalent candidate
        if: steps.gate.outputs.publish == 'true'
        run: |
          python -m pip install --index-url https://pypi.org/simple pytest-homeassistant==2026.11.2
          # Initialize HA's httpx alias before third-party pytest plugin discovery.
          python -c 'import homeassistant; import pytest; raise SystemExit(pytest.main(["-q", "-o", "asyncio_mode=auto", "tests/ha_runtime/test_native_integration.py"]))'
      - name: Verify responsive native bundled UX in Chromium before TEST publication
        if: steps.gate.outputs.publish == 'true'
        run: python scripts/qa_browser.py
      - name: Immutable TEST release with exact package, digest and provenance
        if: steps.gate.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          FILE="dist/robotix_multicharge-$VERSION.zip"
          SHA_FILE="$FILE.sha256"
          (cd dist && sha256sum "robotix_multicharge-$VERSION.zip" > "robotix_multicharge-$VERSION.zip.sha256")
          python - <<'PY'
          import json
          from pathlib import Path
          request = json.loads(Path("release/TEST_REQUEST.json").read_text())
          Path("dist/release-notes.md").write_text(
              "## Authorized TEST scope\n\n" + request["qualification_scope"]
              + "\n\n## Limitations and rollback\n\n" + request["limitations"]
              + "\n\nSource ZIP and SHA256 accompany the immutable tag.\n")
          PY
          gh release create "$TAG" "$FILE" "$SHA_FILE" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "Robotix MultiCharge $VERSION — TEST" \
            --prerelease \
            --notes-file dist/release-notes.md
          TAG_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')"
          test "$TAG_SHA" = "$SOURCE_SHA"
          test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq '.isPrerelease')" = true
          echo "Published immutable community TEST $TAG at $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Source ZIP: $(sha256sum "$FILE")" >> "$GITHUB_STEP_SUMMARY"
